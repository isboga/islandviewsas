<header class="pc-head"><a href="javascript:history.back()" class="pc-brand"><span>IV</span><strong>ISLAND <b>VIEW</b></strong></a><div class="pc-title"><strong id="pc-name">Nube de puntos</strong><small>Potree · COPC</small></div><div class="pc-actions"><button id="pc-fit" title="Encuadrar">⌂</button><button id="pc-full" title="Pantalla completa">⛶</button><button onclick="history.back()" title="Volver">←</button></div></header>
<div id="potree_sidebar_container"></div><div id="potree_render_area"></div>
<button id="pc-potree-tools" class="pc-potree-tools" title="Abrir todas las herramientas de Potree">☰ <span>Potree</span></button><div class="pc-toolbar">
 <button data-tool="point" title="Marcar punto"><span>●</span><em>Punto</em></button>
 <button data-tool="distance" title="Medir distancia"><span>╱</span><em>Distancia</em></button>
 <button data-tool="area" title="Medir área"><span>△</span><em>Área</em></button>
 <button data-tool="height" title="Medir altura"><span>↕</span><em>Altura</em></button>
 <i></i><button data-tool="profile" title="Perfil"><span>⌁</span><em>Perfil</em></button>
 <button data-tool="volume" title="Volumen"><span>◇</span><em>Volumen</em></button><button data-tool="clip" title="Caja de recorte"><span>▣</span><em>Recorte 3D</em></button>
 <i></i><button id="pc-export" title="Exportar mediciones GeoJSON"><span>⇩</span><em>Exportar GeoJSON</em></button><button id="pc-clear" title="Limpiar"><span>⌫</span><em>Limpiar</em></button>
</div>
<div class="pc-display">
 <label><input id="pc-edl" type="checkbox" checked> EDL</label>
 <label>Color <select id="pc-color"><option value="RGB">RGB</option><option value="ELEVATION">Elevación</option><option value="CLASSIFICATION">Clasificación</option><option value="INTENSITY">Intensidad</option></select></label>
 <label>Tamaño <input id="pc-size" type="range" min=".5" max="5" step=".5" value="1"></label>
 <label>EDL fuerza <input id="pc-edl-strength" type="range" min=".1" max="3" step=".1" value="1"></label><label>Radio <input id="pc-edl-radius" type="range" min=".5" max="3" step=".1" value="1.4"></label><label><input id="pc-boxes" type="checkbox"> Cajas</label>
 <label>Presupuesto <select id="pc-budget"><option value="2000000">2 M</option><option value="5000000" selected>5 M</option><option value="10000000">10 M</option></select></label>
 </div>
<button id="pc-class-btn" class="pc-class-btn">Clasificación LAS</button>
<aside id="pc-class-panel" class="pc-class-panel hidden"><header><strong>Clasificación LAS</strong><button id="pc-class-close">×</button></header><div id="pc-class-list"></div><footer><button id="pc-class-all">Todas</button><button id="pc-class-none">Ninguna</button></footer></aside>
<div id="pc-loading" class="pc-loading"><span></span><strong>Cargando nube de puntos…</strong><small>Potree · COPC streaming</small></div><div id="pc-error" class="pc-error hidden"></div>
