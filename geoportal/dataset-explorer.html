<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Island View · Dataset Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">\n<link rel="stylesheet" href="./dataset-explorer.css">
</head>
<body>
<div class="db-shell">
<header class="db-header">
 <a class="db-brand" href="./"><span class="db-logo">IV</span><span><strong>ISLAND <b>VIEW</b></strong><small>GEOSPATIAL DATA PLATFORM</small></span></a>
 <div class="db-head-actions"><button title="Proyectos">⌘</button><button title="Descargar">⇩</button><button title="Herramientas">⌕</button><button title="Cuenta">●</button></div>
</header>
<aside class="db-tree-panel">
 <div class="db-search"><span>⌕</span><input id="db-search" type="search" placeholder="Buscar archivos"></div>
 <div id="db-tree" class="db-tree"><div class="db-loading">Cargando dataset…</div></div>
</aside>
<main class="db-main">
 <nav class="db-tabs"><button class="active" data-tab="files"><span>▰</span> Archivos</button><button data-tab="map"><span>◫</span> Mapa</button><button data-tab="info"><span>ⓘ</span> Información</button></nav>
 <div class="db-toolbar"><div><button title="Agregar">＋</button><button title="Nueva carpeta">▰</button><button title="Seleccionar">☑</button></div><div><button id="db-refresh" title="Actualizar">↻</button><button id="db-view-toggle" title="Cambiar vista">☷</button></div></div>
 <section id="db-files" class="db-grid"><div class="db-loading">Consultando productos geoespaciales…</div></section>
 <section id="db-map-tab" class="db-map-tab hidden">
   <div id="db-map"></div>
   <div class="db-map-status"><strong>Vista satelital</strong><span id="db-map-count">Preparando ortomosaicos…</span></div>
   <div class="db-gis-tools" aria-label="Herramientas GIS">
    <button data-gis="inspect" title="Consultar coordenadas / valor">⌖</button>
    <button data-gis="point" title="Anotación de punto">●</button>
    <button data-gis="distance" title="Medir distancia">╱</button>
    <button data-gis="area" title="Medir área">△</button>
    <button data-gis="profile" title="Perfil de elevación">⌁</button>
    <button data-gis="volume" title="Volumen">◇</button>
    <button data-gis="contours" title="Curvas de nivel">≋</button>
    <i></i><button data-gis="clear" title="Limpiar mediciones">⌫</button>
   </div>
   <div id="db-analysis" class="db-analysis hidden"><header><strong id="db-analysis-title">Análisis</strong><button id="db-analysis-close">×</button></header><div id="db-analysis-body"></div></div>
   <div class="db-map-actions">
    <button id="db-map-home" title="Ver San Andrés">⌂</button>
    <button id="db-map-layers-btn" title="Capas">▱</button>
    <button id="db-map-full" title="Pantalla completa">⛶</button>
   </div>
   <aside id="db-map-layers" class="db-map-layers hidden"><header><strong>Ortomosaicos</strong><button id="db-map-layers-close">×</button></header><div id="db-map-layer-list"></div></aside>
 </section>
 <section id="db-info-tab" class="db-info-tab hidden">
  <div class="db-info-hero"><div><span>DATASET</span><h2 id="db-info-title">Información del proyecto</h2><p id="db-info-description"></p></div><div id="db-info-badges" class="db-info-badges"></div></div>
  <div class="db-info-grid">
   <article><h3>Resumen geoespacial</h3><div id="db-info-summary"></div></article>
   <article><h3>Formatos y visores</h3><div id="db-info-formats"></div></article>
   <article><h3>Herramientas disponibles</h3><div id="db-info-tools" class="db-capabilities"></div></article>
   <article><h3>Fuente de datos</h3><div id="db-info-source"></div></article>
  </div>
 </section>
</main>
<div id="db-toast" class="db-toast hidden"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>\n<script type="module" src="./dataset-explorer.js?v=20261004-1345"></script>
</body></html>
